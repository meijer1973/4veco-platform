<!DOCTYPE html>
<html lang="nl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>Golden ticket reference fixture</title>
  <link rel="stylesheet" href="../../shared/golden-ticket-layout.css">
</head>
<body>
  <header class="ge-topbar">
    <a class="ge-back" href="index.html">&larr; Overzicht</a>
    <strong>&sect;1.1.3 Grafieken en tabellen</strong>
    <button class="ge-theme-toggle" id="theme-toggle">Donkere modus</button>
  </header>
  <main class="ge-page" data-golden-ticket-root data-source-key="1.1.3-exit-ticket">
    <section class="ge-hero">
      <div class="ge-hero-card">
        <h1>Exit ticket: van tabel naar grafiek naar kritische controle</h1>
      </div>
      <nav class="ge-route-panel" aria-label="Oefenroute bij herstel">
        <h2>Oefenroute bij herstel</h2>
        <div class="ge-route-strip">
          <a class="ge-route-pill" href="1.1.3%20Grafieken%20en%20tabellen%20%E2%80%93%20grafiekenspel.html">Grafiekenspel</a>
          <a class="ge-route-pill" href="../1.1.2%20Percentages%20en%20indexcijfers/1.1.2%20Percentages%20en%20indexcijfers%20%E2%80%93%20wiskundevaardigheden.html">Wiskundevaardigheden</a>
        </div>
      </nav>
    </section>
    <section class="ge-workbench">
      <aside class="ge-source-card">
        <h2>Bron 1 — broodjeskraam bij het station</h2>
      </aside>
      <section class="ge-task-card">
        <h2>Werkvragen</h2>
        <svg class="ge-graph"
          data-graph-id="golden-ticket-113"
          data-expected-x-label="Hoeveelheid Q (broodjes)"
          data-expected-y-label="Prijs P (EUR)"
          data-expected-points="350,1;300,1.5;250,2;200,2.5;150,3"
          data-line-or-shape="decreasing"
          viewBox="0 0 680 430"
          role="img"
          aria-label="Interactief grafiekwerkvlak"></svg>
        <section class="ge-step ge-locked" data-ge-step="reading" aria-disabled="true">
          <div class="ge-lock-overlay" aria-hidden="true"><span>Rond eerst het vorige onderdeel af.</span></div>
        </section>
      </section>
    </section>
  </main>
  <script src="../../shared/exit-ticket/1.1.3-exit-ticket.js"></script>
  <script src="../../shared/golden-ticket-graph.js"></script>
  <script src="../../shared/golden-ticket-layout.js"></script>
</body>
</html>
