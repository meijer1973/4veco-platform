<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" viewBox="0 0 760 900" role="img" aria-labelledby="title desc">
  <title id="title">Het patroon van MK hangt af van de kostenfunctie</title>
  <desc id="desc">Vergelijking tussen lineaire kosten met constante MK en stijgende kosten met oplopende MK.</desc>
  <rect width="760" height="900" fill="#ffffff"/>
  <g font-family="Arial, DejaVu Sans, sans-serif">
    <text x="45" y="52" font-size="36" font-weight="700" fill="#1A5276">Het patroon van MK hangt af</text>
    <text x="45" y="92" font-size="36" font-weight="700" fill="#1A5276">van de kostenfunctie</text>
    <text x="47" y="132" font-size="30" font-weight="700" fill="#333">Verschil tussen rijen delen door de stapgrootte.</text>

    <rect x="55" y="175" width="650" height="300" rx="24" fill="#EAF3FA" stroke="#1A5276" stroke-width="5"/>
    <text x="85" y="228" font-size="35" font-weight="700" fill="#1A5276">Lineaire kosten</text>
    <text x="85" y="278" font-size="33" font-weight="700" fill="#1a1a1a">TK = 200 + 3Q</text>
    <text x="85" y="324" font-size="31" fill="#1a1a1a">Bij elk extra product komt er 3 euro bij.</text>
    <rect x="85" y="355" width="560" height="70" rx="16" fill="#ffffff" stroke="#9bbbd4" stroke-width="3"/>
    <text x="120" y="400" font-size="33" font-weight="700" fill="#1a1a1a">MK = 3</text>
    <text x="285" y="400" font-size="31" fill="#1a1a1a">in elke stap</text>
    <text x="85" y="455" font-size="30" fill="#333">Gelijke Q-stappen, dezelfde MK.</text>

    <rect x="55" y="515" width="650" height="360" rx="24" fill="#EEF7EE" stroke="#3B7A3B" stroke-width="5"/>
    <text x="85" y="568" font-size="35" font-weight="700" fill="#3B7A3B">Stijgende kosten</text>
    <text x="85" y="618" font-size="33" font-weight="700" fill="#1a1a1a">TK = 100 + Q^2</text>
    <text x="85" y="664" font-size="31" fill="#1a1a1a">De extra kosten worden steeds groter.</text>
    <text x="85" y="710" font-size="31" fill="#1a1a1a">Bij stappen van 5 producten:</text>

    <g font-size="30" fill="#1a1a1a">
      <rect x="85" y="740" width="130" height="78" rx="16" fill="#FFF8E6" stroke="#B7791F" stroke-width="4"/>
      <text x="150" y="772" text-anchor="middle">0-5</text>
      <text x="150" y="807" text-anchor="middle" font-weight="700">MK 5</text>
      <rect x="240" y="740" width="130" height="78" rx="16" fill="#FFF8E6" stroke="#B7791F" stroke-width="4"/>
      <text x="305" y="772" text-anchor="middle">5-10</text>
      <text x="305" y="807" text-anchor="middle" font-weight="700">MK 15</text>
      <rect x="395" y="740" width="130" height="78" rx="16" fill="#FFF8E6" stroke="#B7791F" stroke-width="4"/>
      <text x="460" y="772" text-anchor="middle">10-15</text>
      <text x="460" y="807" text-anchor="middle" font-weight="700">MK 25</text>
      <rect x="550" y="740" width="130" height="78" rx="16" fill="#FFF8E6" stroke="#B7791F" stroke-width="4"/>
      <text x="615" y="772" text-anchor="middle">15-20</text>
      <text x="615" y="807" text-anchor="middle" font-weight="700">MK 35</text>
    </g>
    <text x="130" y="855" font-size="31" font-weight="700" fill="#1a1a1a">MK stijgt: 5 &lt; 15 &lt; 25 &lt; 35</text>
  </g>
</svg>
