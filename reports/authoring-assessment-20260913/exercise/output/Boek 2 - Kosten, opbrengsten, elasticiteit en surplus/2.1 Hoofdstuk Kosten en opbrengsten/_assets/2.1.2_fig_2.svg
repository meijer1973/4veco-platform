<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="title desc">
  <title id="title">Break-even grafiek met TK en TO</title>
  <desc id="desc">Grafiek waarin TO en TK elkaar kruisen; bij Q is 1000 is de verticale afstand winst.</desc>
  <rect width="760" height="610" fill="white"/>
  <g font-family="Arial, DejaVu Sans, sans-serif">
    <text x="40" y="45" font-size="38" font-weight="700" fill="#1A5276">Break-even: TO en TK kruisen elkaar</text>
    <text x="40" y="88" font-size="30" font-weight="700" fill="#333">Winst bij een Q = verticale afstand tussen TO en TK.</text>

    <line x1="95" y1="490" x2="690" y2="490" stroke="#222" stroke-width="3"/>
    <line x1="95" y1="490" x2="95" y2="130" stroke="#222" stroke-width="3"/>
    <g stroke="#D7DDE3" stroke-width="2">
      <line x1="95" y1="390" x2="690" y2="390"/>
      <line x1="95" y1="290" x2="690" y2="290"/>
      <line x1="95" y1="190" x2="690" y2="190"/>
      <line x1="342" y1="490" x2="342" y2="130"/>
      <line x1="590" y1="490" x2="590" y2="130"/>
    </g>

    <path d="M95 490 L690 140" stroke="#1A5276" stroke-width="7" fill="none"/>
    <path d="M95 390 L690 200" stroke="#9A3412" stroke-width="7" fill="none"/>
    <line x1="445" y1="490" x2="445" y2="275" stroke="#555" stroke-width="3" stroke-dasharray="8 7"/>
    <line x1="590" y1="490" x2="590" y2="205" stroke="#555" stroke-width="3" stroke-dasharray="8 7"/>
    <rect x="574" y="205" width="32" height="47" fill="#DFF2E3" stroke="#267A3E" stroke-width="3"/>

    <circle cx="445" cy="275" r="9" fill="#111"/>
    <circle cx="590" cy="205" r="8" fill="#1A5276"/>
    <circle cx="590" cy="252" r="8" fill="#9A3412"/>

    <text x="470" y="165" font-size="30" font-weight="700" fill="#1A5276">TO = 1,50Q</text>
    <text x="458" y="245" font-size="30" font-weight="700" fill="#9A3412">TK = 500 + 0,80Q</text>

    <rect x="250" y="300" width="235" height="78" rx="14" fill="#ffffff" stroke="#777" stroke-width="3"/>
    <text x="270" y="332" font-size="30" font-weight="700" fill="#222">break-even</text>
    <text x="270" y="366" font-size="30" fill="#444">TO = TK, Q ca. 714</text>

    <rect x="480" y="92" width="235" height="78" rx="14" fill="#ffffff" stroke="#777" stroke-width="3"/>
    <text x="500" y="124" font-size="30" font-weight="700" fill="#222">Q=1000: winst</text>
    <text x="500" y="158" font-size="30" fill="#444">verticale afstand</text>

    <g font-size="30" fill="#222">
      <text x="68" y="525">Q=0</text>
      <text x="300" y="525">Q=500</text>
      <text x="540" y="525">Q=1000</text>
      <text x="522" y="580">aantal broden</text>
      <text x="22" y="398">500</text>
      <text x="8" y="298">1000</text>
      <text x="8" y="198">1500</text>
      <text x="50" y="130">euro</text>
    </g>
  </g>
</svg>
