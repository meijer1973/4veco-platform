<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <title>TASK-FAMILY-SENTENCE-1 rendered fixture</title>
  <link rel="stylesheet" href="../../engines/task-shell.css">
</head>
<body>
  <main class="ts-shell" data-task-shell="GAME-UX-3A">
    <article class="ts-task" data-task="sentence-demand-chain" data-task-family="sentence_builder">
      <div class="ts-task-meta">
        <span>Taak 1</span>
        <span>Redenering bouwen</span>
        <span>Zin bouwen</span>
      </div>
      <h2>Zet de economische redenering in de juiste volgorde.</h2>
      <p class="ts-purpose">Bouw een gecontroleerde oorzaak-gevolg-redenering uit fragmenten.</p>
      <div class="ts-sentence" data-sentence-task="sentence-demand-chain" data-allow-reuse="false" data-separator=" -&gt; ">
        <div class="ts-sentence-sequence" role="list" tabindex="0" data-task-id="sentence-demand-chain" data-sentence-sequence aria-label="Opgebouwde redenering">
          <span class="ts-sentence-placeholder">Bouw je redenering met de fragmenten.</span>
        </div>
        <div class="ts-sentence-bank" role="group" aria-label="Fragmentbank">
          <button type="button" class="ts-sentence-token" data-task-id="sentence-demand-chain" data-sentence-token-id="prijs-stijgt" aria-pressed="false"><span class="ts-sentence-token-label">De prijs stijgt</span></button>
          <button type="button" class="ts-sentence-token" data-task-id="sentence-demand-chain" data-sentence-token-id="vraag-daalt" aria-pressed="false"><span class="ts-sentence-token-label">de gevraagde hoeveelheid daalt</span></button>
          <button type="button" class="ts-sentence-token" data-task-id="sentence-demand-chain" data-sentence-token-id="hogere-prijs" aria-pressed="false"><span class="ts-sentence-token-label">bij een hogere prijs</span></button>
          <button type="button" class="ts-sentence-token" data-task-id="sentence-demand-chain" data-sentence-token-id="vraag-stijgt" aria-pressed="false"><span class="ts-sentence-token-label">de gevraagde hoeveelheid stijgt</span></button>
        </div>
        <button type="button" class="ts-sentence-clear" data-task-id="sentence-demand-chain" data-sentence-clear aria-label="Opgebouwde zin leegmaken">Leegmaken</button>
      </div>
      <div class="ts-feedback" data-feedback-for="sentence-demand-chain" aria-live="polite" role="status" aria-label="Feedback op je antwoord" tabindex="-1"></div>
    </article>
  </main>
</body>
</html>
