<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <title>TASK-FAMILY-CLOZE-TILE-1 rendered fixture</title>
  <link rel="stylesheet" href="../../engines/task-shell.css">
</head>
<body>
  <section class="ts-shell" data-task-shell="GAME-UX-3A">
    <article class="ts-task" data-task="cloze-indexpunten" data-task-family="cloze_tile_select">
      <div class="ts-task-meta">
        <span>Taak 1</span>
        <span>Indexpunten invullen</span>
        <span>Invullen met tegels</span>
      </div>
      <h2>Maak de zin over indexpunten af.</h2>
      <p class="ts-purpose">Vul een gecontroleerde indexzin aan met tegels.</p>
      <div class="ts-cloze" data-cloze-task="cloze-indexpunten" data-allow-reuse="false">
        <p class="ts-cloze-line">
          <span class="ts-cloze-text">De stijging van 108 naar 112 is </span>
          <span class="ts-cloze-slot">
            <button type="button" class="ts-cloze-blank" data-task-id="cloze-indexpunten" data-cloze-blank-id="indexpunten" data-selected-tile="" data-cloze-label="Stijging in indexpunten" data-cloze-placeholder="Kies tegel" aria-label="Stijging in indexpunten: nog leeg"><span class="ts-cloze-blank-text">Kies tegel</span></button>
            <button type="button" class="ts-cloze-clear" data-task-id="cloze-indexpunten" data-cloze-clear-id="indexpunten" aria-label="Stijging in indexpunten leegmaken" hidden>&times;</button>
          </span>
          <span class="ts-cloze-text"> indexpunten. De procentuele stijging deel je door </span>
          <span class="ts-cloze-slot">
            <button type="button" class="ts-cloze-blank" data-task-id="cloze-indexpunten" data-cloze-blank-id="basis" data-selected-tile="" data-cloze-label="Basis voor procentuele stijging" data-cloze-placeholder="Kies tegel" aria-label="Basis voor procentuele stijging: nog leeg"><span class="ts-cloze-blank-text">Kies tegel</span></button>
            <button type="button" class="ts-cloze-clear" data-task-id="cloze-indexpunten" data-cloze-clear-id="basis" aria-label="Basis voor procentuele stijging leegmaken" hidden>&times;</button>
          </span>
          <span class="ts-cloze-text">.</span>
        </p>
        <div class="ts-cloze-bank" role="group" aria-label="Tegelbank">
          <button type="button" class="ts-cloze-tile" data-task-id="cloze-indexpunten" data-cloze-tile-id="vier" aria-pressed="false"><span class="ts-cloze-tile-label">4</span></button>
          <button type="button" class="ts-cloze-tile" data-task-id="cloze-indexpunten" data-cloze-tile-id="honderdacht" aria-pressed="false"><span class="ts-cloze-tile-label">108</span></button>
          <button type="button" class="ts-cloze-tile" data-task-id="cloze-indexpunten" data-cloze-tile-id="vier-procent" aria-pressed="false"><span class="ts-cloze-tile-label">4%</span></button>
          <button type="button" class="ts-cloze-tile" data-task-id="cloze-indexpunten" data-cloze-tile-id="honderd" aria-pressed="false"><span class="ts-cloze-tile-label">100</span></button>
        </div>
      </div>
      <div class="ts-feedback" data-feedback-for="cloze-indexpunten" aria-live="polite" role="status" aria-label="Feedback op je antwoord" tabindex="-1"></div>
    </article>
  </section>
</body>
</html>
