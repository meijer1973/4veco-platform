  <title>TASK-CONTEXT-RUNTIME-1 Reviewlab</title>
  <link rel="stylesheet" href="../../engines/task-shell.css">
  <style>
    body {
      margin: 0;
      background: var(--ts-bg);
      color: var(--ts-text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      box-sizing: border-box;
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }
    .lab-toolbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: flex-end;
      padding: 10px 0;
      background: var(--ts-bg);
    }
    .lab-toolbar button {
      min-height: 38px;
      padding: 8px 11px;
      border: 1px solid var(--ts-line);
      border-radius: var(--ts-radius);
      background: var(--ts-panel);
      color: var(--ts-text);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    .lab-toolbar button:focus-visible {
      outline: 2px solid var(--ts-focus);
      outline-offset: 2px;
    }
    .lab-state {
      color: var(--ts-muted);
      font-weight: 700;
    }
  </style>
</head>
<body>

    <div class="lab-toolbar" aria-label="Reviewlab bediening">

      <button type="button" data-lab-complete>Vul correct in</button>
      <button type="button" data-lab-check>Controleer</button>
      <span class="lab-state" data-lab-state>Niet gecontroleerd</span>
    </div>
    <div id="task-shell-lab"></div>
    <p id="review-lab-next-action" class="ts-visually-hidden">Reviewlab vervolgstap.</p>

      var root = document.getElementById('task-shell-lab');
      var state = document.querySelector('[data-lab-state]');
      function task() { return data.tasks[0]; }
      function setState(text) { state.textContent = text; document.body.setAttribute('data-lab-state', text); }
      function render() {
        root.innerHTML = TaskShellUI.renderStaticHtml(data);
        setState('Niet gecontroleerd');
      }
      function setSelected(valueId, role) {
        var button = root.querySelector('[data-source-value-id="' + valueId + '"]');
        var select = root.querySelector('[data-source-role-value-id="' + valueId + '"]');
        if (button && !button.classList.contains('selected')) button.click();
        if (select) select.value = role;
      }
      function check() {
        var response = TaskShellUI.collectSourceValueSelectionResponse(root, task());
        var result = TaskShellEngine.evaluateTask(task(), response);
        var target = root.querySelector('[data-feedback-for="' + task().id + '"]');
        if (target) {
          target.innerHTML = TaskShellUI.renderFeedback(result);
          target.focus();
        }
        setState(result.state === 'matched' ? 'Voltooid' : 'Opnieuw proberen');
        return result;
      }
      root.addEventListener('click', function (event) {
        TaskShellUI.handleSourceValueSelectionClick(root, event);
      });
      document.querySelector('[data-lab-check]').addEventListener('click', check);
      document.querySelector('[data-lab-complete]').addEventListener('click', function () {
        setSelected('premium-standard', 'standard-premium');
        setSelected('premium-raised', 'raised-premium');
        check();
      });
      document.querySelector('[data-lab-theme]').addEventListener('click', function () {
        var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
      });
      window.TaskContextRuntime1Lab = {
        data: data,
        render: render,
        completeCorrect: function () {
          setSelected('premium-standard', 'standard-premium');
          setSelected('premium-raised', 'raised-premium');
          return check();
        },
        inspect: function () {
          var context = document.querySelector('[data-task-context]');
          var tasks = document.querySelector('.ts-task-list');
          var visibleText = document.body.innerText.replace(/\s+/g, ' ');
          var overflowing = Array.from(document.querySelectorAll('body *')).filter(function (el) {
            var rect = el.getBoundingClientRect();
            return rect.right > window.innerWidth + 1 || rect.left < -1;
          }).slice(0, 12).map(function (el) {
            var rect = el.getBoundingClientRect();
            return {
              tag: el.tagName.toLowerCase(),
              id: el.id || '',
              className: String(el.className || '').slice(0, 120),
              left: Math.round(rect.left),
              right: Math.round(rect.right),
              width: Math.round(rect.width)
            };
          });
          return {
            contextBeforeTasks: !!(context && tasks && (context.compareDocumentPosition(tasks) & Node.DOCUMENT_POSITION_FOLLOWING)),
            contextBlockCount: document.querySelectorAll('[data-context-block]').length,
            contextTypes: Array.from(document.querySelectorAll('[data-context-type]')).map(function (el) { return el.getAttribute('data-context-type'); }),
            taskRefCount: document.querySelectorAll('[data-context-ref]').length,
            visibleInternalContextId: /\bctx-[a-z0-9-]+\b/.test(visibleText),
            captions: Array.from(document.querySelectorAll('.ts-context-head h2')).map(function (el) { return el.textContent.trim(); }),
            roleImgCount: document.querySelectorAll('[role="img"][aria-label]').length,
            tableCount: document.querySelectorAll('.ts-context-table').length,
            hintCount: document.querySelectorAll('.ts-hints').length,
            feedbackState: document.querySelector('[data-feedback-state]') ? document.querySelector('[data-feedback-state]').getAttribute('data-feedback-state') : '',
            labState: document.body.getAttribute('data-lab-state') || '',
            theme: document.documentElement.getAttribute('data-theme') || '',
            overflowing: overflowing,
            viewport: { width: window.innerWidth, height: window.innerHeight },
            page: { width: document.documentElement.scrollWidth, height: document.documentElement.scrollHeight }
          };
        }
      };
