<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300"><rect width="800" height="300" rx="8" fill="#f7fafb"/><text x="25" y="28" font-family="Lato,DejaVu Sans,sans-serif" font-size="17" fill="#183247">Zelfde beginsituatie: P₀ = € 8; Q₀ = 60. Zelfde aanbod en belasting t = € 3.</text><text x="28" y="110" font-family="Lato,DejaVu Sans,sans-serif" font-size="19" fill="#183247">Markt A</text><rect x="185" y="90" width="255.0" height="45" fill="#17688f"/><rect x="440.0" y="90" width="255.0" height="45" fill="#22796b"/><text x="200" y="118" font-family="Lato,DejaVu Sans,sans-serif" font-size="17" fill="white">koper € 1,5</text><text x="452.0" y="118" font-family="Lato,DejaVu Sans,sans-serif" font-size="17" fill="white">verkoper € 1,5</text><text x="28" y="202" font-family="Lato,DejaVu Sans,sans-serif" font-size="19" fill="#183247">Markt B</text><rect x="185" y="182" width="340" height="45" fill="#17688f"/><rect x="525" y="182" width="170" height="45" fill="#22796b"/><text x="200" y="210" font-family="Lato,DejaVu Sans,sans-serif" font-size="17" fill="white">koper € 2</text><text x="537" y="210" font-family="Lato,DejaVu Sans,sans-serif" font-size="17" fill="white">verkoper € 1</text><text x="28" y="264" font-family="Lato,DejaVu Sans,sans-serif" font-size="17" fill="#183247">De vraag reageert in B minder sterk. Kopers dragen daar een groter deel.</text></svg>