<text x="450.00000000" y="163.00000000" font-family="Lato,DejaVu Sans,sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#183247">Qv groter dan Qa? Het verschil wordt ingevoerd.</text>
