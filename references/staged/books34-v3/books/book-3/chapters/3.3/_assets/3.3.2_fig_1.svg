<rect width="900" height="226" rx="10" fill="#f5f8fa"/>
<rect x="28.00000000" y="45.00000000" width="396.00000000" height="78.00000000" rx="5" fill="white" stroke="#247d70" stroke-width="1.6"/>
<text x="226.00000000" y="76.00000000" font-family="Lato,DejaVu Sans,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#183247">Binnenlandse producenten</text>
<text x="226.00000000" y="105.00000000" font-family="Lato,DejaVu Sans,sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#183247">leveren Qa</text>
