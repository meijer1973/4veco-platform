<svg xmlns="http://www.w3.org/2000/svg" width="900" height="255" viewBox="0 0 900 255" role="img"><title>Een derde partij buiten de markt</title>
<rect width="900" height="255" rx="8" fill="#f5f8fa"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#637986" stroke-width="1.5"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10L10 0" stroke="#183247" stroke-width="1" opacity=".25"/></pattern><pattern id="horizontal" width="10" height="8" patternUnits="userSpaceOnUse"><path d="M0 4H10" stroke="#183247" stroke-width="1" opacity=".22"/></pattern><pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10L10 0M0 0L10 10" stroke="#183247" stroke-width="1" opacity=".25"/></pattern></defs>
<text x="450.0000" y="28.0000" font-family="Lato,DejaVu Sans,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#183247">Wie neemt deel? Wie ondervindt het effect?</text>
<rect x="35" y="63" width="210" height="85" rx="6" fill="white" stroke="#146d9b" stroke-width="1.3"/>
<text x="140.0000" y="95.0000" font-family="Lato,DejaVu Sans,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#183247">Koper</text>
<text x="140.0000" y="123.0000" font-family="Lato,DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#183247">betaalt de dienst</text>
<rect x="345" y="63" width="210" height="85" rx="6" fill="white" stroke="#146d9b" stroke-width="1.3"/>
<text x="450.0000" y="95.0000" font-family="Lato,DejaVu Sans,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#183247">Aanbieder</text>
<text x="450.0000" y="123.0000" font-family="Lato,DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#183247">ontvangt de prijs</text>
<rect x="655" y="63" width="210" height="85" rx="6" fill="white" stroke="#247d70" stroke-width="1.3"/>
<text x="760.0000" y="95.0000" font-family="Lato,DejaVu Sans,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#183247">Derden</text>
<text x="760.0000" y="123.0000" font-family="Lato,DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#183247">geen marktbetaling</text>
<line x1="250.0000" y1="94.0000" x2="338.0000" y2="94.0000" stroke="#637986" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="294.0000" y="82.0000" font-family="Lato,DejaVu Sans,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#183247">betaling</text>
<line x1="560.0000" y1="105.0000" x2="648.0000" y2="105.0000" stroke="#247d70" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="604.0000" y="89.0000" font-family="Lato,DejaVu Sans,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#183247">effect</text>
<text x="450.0000" y="193.0000" font-family="Lato,DejaVu Sans,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#247d70">Voordeel voor buren</text>
<text x="450.0000" y="222.0000" font-family="Lato,DejaVu Sans,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#183247">Niet vergoed in de onderzochte transactie</text>
</svg>