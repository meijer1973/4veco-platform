<svg xmlns="http://www.w3.org/2000/svg" width="720" height="322" viewBox="0 0 720 322"><rect width="720" height="322" rx="8" fill="#f4f7f9"/><text x="25.000" y="30.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="18" fill="#17688f" font-weight="bold" text-anchor="start">Productieverandering én productiviteit bepalen de uren</text><rect x="20" y="59" width="216" height="175" rx="5" fill="#ffffff" stroke="#cbd7df"/><text x="128.000" y="88.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="16" fill="#17688f" font-weight="bold" text-anchor="middle">Oorspronkelijk</text><text x="128.000" y="127.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="15" fill="#183247" font-weight="normal" text-anchor="middle">2.400 producten</text><text x="128.000" y="166.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="15" fill="#183247" font-weight="normal" text-anchor="middle">4 per arbeidsuur</text><text x="128.000" y="205.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="15" fill="#17688f" font-weight="bold" text-anchor="middle">600 arbeidsuren</text><rect x="255" y="59" width="216" height="175" rx="5" fill="#ffffff" stroke="#cbd7df"/><text x="363.000" y="88.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="16" fill="#17688f" font-weight="bold" text-anchor="middle">Zelfde productie</text><text x="363.000" y="127.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="15" fill="#183247" font-weight="normal" text-anchor="middle">2.400 producten</text><text x="363.000" y="166.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="15" fill="#183247" font-weight="normal" text-anchor="middle">5 per arbeidsuur</text><text x="363.000" y="205.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="15" fill="#17688f" font-weight="bold" text-anchor="middle">480 arbeidsuren</text><rect x="490" y="59" width="216" height="175" rx="5" fill="#ffffff" stroke="#cbd7df"/><text x="598.000" y="88.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="16" fill="#17688f" font-weight="bold" text-anchor="middle">Meer opdrachten</text><text x="598.000" y="127.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="15" fill="#183247" font-weight="normal" text-anchor="middle">3.300 producten</text><text x="598.000" y="166.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="15" fill="#183247" font-weight="normal" text-anchor="middle">5 per arbeidsuur</text><text x="598.000" y="205.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="15" fill="#17688f" font-weight="bold" text-anchor="middle">660 arbeidsuren</text><text x="360.000" y="268.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="16" fill="#183247" font-weight="normal" text-anchor="middle">Bij 3.000 producten en 5 producten per uur blijven 600 uren nodig.</text><text x="360.000" y="296.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="15" fill="#596d7c" font-weight="normal" text-anchor="middle">Dit rekenschema is geen bewijs dat werkgelegenheid altijd daalt.</text></svg>