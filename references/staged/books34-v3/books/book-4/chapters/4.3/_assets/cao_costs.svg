<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320"><rect width="720" height="320" rx="8" fill="#f4f7f9"/><text x="24.000" y="29.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="18" fill="#17688f" font-weight="bold" text-anchor="start">Eén product: uurkosten delen door productie per uur</text><rect x="25" y="62" width="315" height="167" rx="5" fill="#ffffff" stroke="#cbd7df"/><text x="182.000" y="91.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="17" fill="#17688f" font-weight="bold" text-anchor="middle">Oud</text><text x="182.000" y="128.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="16" fill="#183247" font-weight="normal" text-anchor="middle">€ 24 per uur</text><text x="182.000" y="165.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="16" fill="#183247" font-weight="normal" text-anchor="middle">÷ 4 producten per uur</text><text x="182.000" y="202.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="16" fill="#17688f" font-weight="bold" text-anchor="middle">= € 6 per product</text><rect x="380" y="62" width="315" height="167" rx="5" fill="#ffffff" stroke="#cbd7df"/><text x="537.000" y="91.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="17" fill="#17688f" font-weight="bold" text-anchor="middle">Nieuw</text><text x="537.000" y="128.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="16" fill="#183247" font-weight="normal" text-anchor="middle">€ 25,20 per uur</text><text x="537.000" y="165.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="16" fill="#183247" font-weight="normal" text-anchor="middle">÷ 4,5 producten per uur</text><text x="537.000" y="202.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="16" fill="#17688f" font-weight="bold" text-anchor="middle">= € 5,60 per product</text><text x="360.000" y="263.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="15" fill="#183247" font-weight="normal" text-anchor="middle">Uurkosten: +5%. Productiviteit: +12,5%. Kosten per product: −6,67%.</text><text x="360.000" y="293.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="15" fill="#596d7c" font-weight="normal" text-anchor="middle">Twee groeipercentages aftrekken geeft niet de exacte verandering.</text></svg>