<svg xmlns="http://www.w3.org/2000/svg" width="720" height="275" viewBox="0 0 720 275"><rect width="720" height="275" rx="8" fill="#f4f7f9"/><text x="24.000" y="29.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="18" fill="#17688f" font-weight="bold" text-anchor="start">Kijk naar de oorzaak, niet alleen naar de duur</text><rect x="20" y="59" width="216" height="151" rx="5" fill="#ffffff" stroke="#cbd7df"/><text x="128.000" y="89.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="16" fill="#17688f" font-weight="bold" text-anchor="middle">Conjunctureel</text><text x="128.000" y="120.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="14.5" fill="#183247" font-weight="normal" text-anchor="middle">Minder bestedingen</text><text x="128.000" y="151.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="14.5" fill="#183247" font-weight="normal" text-anchor="middle">→ minder opdrachten</text><text x="128.000" y="182.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="14.5" fill="#183247" font-weight="normal" text-anchor="middle">→ minder personeel</text><rect x="255" y="59" width="216" height="151" rx="5" fill="#ffffff" stroke="#cbd7df"/><text x="363.000" y="89.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="16" fill="#17688f" font-weight="bold" text-anchor="middle">Structureel</text><text x="363.000" y="120.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="14.5" fill="#183247" font-weight="normal" text-anchor="middle">Werk of vaardigheden</text><text x="363.000" y="151.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="14.5" fill="#183247" font-weight="normal" text-anchor="middle">passen niet meer</text><text x="363.000" y="182.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="14.5" fill="#183247" font-weight="normal" text-anchor="middle">→ aanpassing nodig</text><rect x="490" y="59" width="216" height="151" rx="5" fill="#ffffff" stroke="#cbd7df"/><text x="598.000" y="89.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="16" fill="#17688f" font-weight="bold" text-anchor="middle">Frictie</text><text x="598.000" y="120.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="14.5" fill="#183247" font-weight="normal" text-anchor="middle">Zoeken en overstappen</text><text x="598.000" y="151.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="14.5" fill="#183247" font-weight="normal" text-anchor="middle">kosten tijd</text><text x="598.000" y="182.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="14.5" fill="#183247" font-weight="normal" text-anchor="middle">→ tijdelijk geen werk</text><text x="360.000" y="246.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="15" fill="#596d7c" font-weight="normal" text-anchor="middle">Frictiewerkloosheid rekenen we hier tot structurele werkloosheid.</text></svg>