<svg xmlns="http://www.w3.org/2000/svg" width="720" height="294" viewBox="0 0 720 294"><rect width="720" height="294" rx="8" fill="#f4f7f9"/><text x="24.000" y="30.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="18" fill="#17688f" font-weight="bold" text-anchor="start">Personen, uren en voltijdbanen zijn verschillende maten</text><rect x="26" y="62" width="200" height="129" rx="5" fill="#e5eef3" stroke="#cbd7df"/><text x="126.000" y="92.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="21" fill="#17688f" font-weight="bold" text-anchor="middle">6 personen</text><text x="126.000" y="122.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="17" fill="#183247" font-weight="normal" text-anchor="middle">ieder 20 uur</text><text x="126.000" y="150.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="16" fill="#183247" font-weight="normal" text-anchor="middle">per week</text><line x1="239.0000" y1="125.0000" x2="294.0000" y2="125.0000" stroke="#17688f" stroke-width="2" /><path d="M286.6315120479769,128.1153467384692 L294,125 L286.6315120479769,121.8846532615308" fill="none" stroke="#17688f" stroke-width="2"/><rect x="306" y="62" width="174" height="129" rx="5" fill="#e1eee8" stroke="#cbd7df"/><text x="393.000" y="92.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="21" fill="#227064" font-weight="bold" text-anchor="middle">120 uur</text><text x="393.000" y="124.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="16" fill="#183247" font-weight="normal" text-anchor="middle">arbeidsinzet</text><text x="393.000" y="151.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="16" fill="#183247" font-weight="normal" text-anchor="middle">per week</text><line x1="493.0000" y1="125.0000" x2="535.0000" y2="125.0000" stroke="#17688f" stroke-width="2" /><path d="M527.6315120479769,128.1153467384692 L535,125 L527.6315120479769,121.8846532615308" fill="none" stroke="#17688f" stroke-width="2"/><rect x="547" y="62" width="149" height="129" rx="5" fill="#ffffff" stroke="#cbd7df"/><text x="621.000" y="96.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="23" fill="#183247" font-weight="bold" text-anchor="middle">3 fte</text><text x="621.000" y="127.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="16" fill="#183247" font-weight="normal" text-anchor="middle">120 ÷ 40</text><text x="360.000" y="230.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="16" fill="#183247" font-weight="normal" text-anchor="middle">In dit voorbeeld is een voltijdbaan 40 uur per week.</text><text x="360.000" y="263.000" font-family="Lato,DejaVu Sans,sans-serif" font-size="15" fill="#596d7c" font-weight="normal" text-anchor="middle">De zes personen verdwijnen niet doordat je hun uren omrekent naar fte.</text></svg>