name: platform-ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  artifact-metadata: write

concurrency:
  group: platform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-platform:
    name: validate-platform
    runs-on: windows-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: pwsh
        working-directory: 4veco-platform

    steps:
      - name: Checkout platform repository
        uses: actions/checkout@v6
        with:
          path: 4veco-platform
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout lessen repository
        uses: actions/checkout@v6
        with:
          repository: meijer1973/4veco-lessen
          path: 4veco-lessen
          fetch-depth: 0
          persist-credentials: true

      - name: Normalize repository line endings
        run: |
          git config --global core.autocrlf false
          git reset --hard
          git -c core.autocrlf=false checkout-index -f -- reports/url-index.md
          git -C ../4veco-lessen reset --hard

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: 4veco-platform/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: 4veco-platform/.github/ci-python-requirements.txt

      - name: Write checkout evidence
        run: |
          New-Item -ItemType Directory -Force -Path ..\ci-artifacts | Out-Null
          node build-scripts/ci/platform-ci-evidence.js write --output ..\ci-artifacts\platform-ci-evidence.json --platform-path . --lessen-path ..\4veco-lessen
          node build-scripts/ci/platform-ci-evidence.js check ..\ci-artifacts\platform-ci-evidence.json --platform-path . --lessen-path ..\4veco-lessen

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python support dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .github/ci-python-requirements.txt

      - name: Install presentation proof tools
        run: |
          choco install libreoffice-fresh poppler -y --no-progress
          "C:\Program Files\LibreOffice\program" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Validate platform Jest suite
        run: npm run check:platform

      - name: Build presentation-v2 registered decks
        run: npm run build:presentation-v2

      - name: Validate presentation-v2 PPTX proof
        run: npm run check:presentation-v2-pptx-proof -- --output-dir ..\ci-artifacts\presentation-v2-pptx-proof

      - name: Validate reasoning golden family guardrails
        run: npm run check:reasoning-golden

      - name: Validate paragraph landing V2 guardrails
        run: npm run check:landing-v2

      - name: Validate News Detective V2 guardrails
        run: npm run check:news-detective-v2

      - name: Validate active scope language
        run: npm run check:scope-language

      - name: Validate active governance wording
        run: npm run check:active-governance-wording

      - name: Validate Golden Graph Advisory 113 proof
        run: npm run check:golden-graph-advisory-113

      - name: Validate Scale Proof 3P product path proof
        run: npm run check:scale-proof-3p-product-path

      - name: Validate report JSON
        run: node build-scripts/reports/validate-report-json.js

      - name: Validate MTU evidence layer freshness
        run: node build-scripts/references/check-mtu-evidence-layer.js

      - name: Validate roadmap version index
        run: node build-scripts/references/check-roadmap-version-index.js

      - name: Check URL index is current
        run: node build-scripts/sprints/emit-url-index.js --check

      - name: Check CI evidence line endings
        run: node build-scripts/ci/check-evidence-line-endings.js

      - name: Check platform diff hygiene
        run: git diff --check

      - name: Check lessen diff hygiene
        run: git -C ../4veco-lessen diff --check

      - name: Upload CI diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-ci-diagnostics
          path: |
            4veco-platform/reports/sprints/*-command-log.jsonl
            4veco-platform/reports/sprints/*-command-log.md
            4veco-platform/reports/json/*.json
            4veco-platform/reports/url-index.md
            ci-artifacts/platform-ci-evidence.json
            ci-artifacts/presentation-v2-pptx-proof/**
          if-no-files-found: ignore
          retention-days: 14
