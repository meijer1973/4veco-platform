name: platform-ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      y1_base_sha:
        description: Exact platform base SHA for the Y1 Golden scope attestation
        required: true
        type: string
      y1_head_sha:
        description: Exact platform head SHA for the Y1 Golden scope attestation
        required: true
        type: string

permissions:
  contents: read
  artifact-metadata: write

concurrency:
  group: platform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-platform:
    name: validate-platform
    runs-on: windows-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: pwsh
        working-directory: 4veco-platform

    steps:
      - name: Checkout platform repository
        uses: actions/checkout@v6
        with:
          path: 4veco-platform
          ref: ${{ inputs.y1_head_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout lessen repository
        uses: actions/checkout@v6
        with:
          repository: meijer1973/4veco-lessen
          path: 4veco-lessen
          fetch-depth: 0
          persist-credentials: true

      - name: Normalize repository line endings
        run: |
          git config --global core.autocrlf false
          git reset --hard
          git -c core.autocrlf=false checkout-index -f -- reports/url-index.md
          git -C ../4veco-lessen reset --hard

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: 4veco-platform/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: 4veco-platform/.github/ci-python-requirements.txt

      - name: Write checkout evidence
        run: |
          New-Item -ItemType Directory -Force -Path ..\ci-artifacts | Out-Null
          node build-scripts/ci/platform-ci-evidence.js write --output ..\ci-artifacts\platform-ci-evidence.json --platform-path . --lessen-path ..\4veco-lessen
          node build-scripts/ci/platform-ci-evidence.js check ..\ci-artifacts\platform-ci-evidence.json --platform-path . --lessen-path ..\4veco-lessen

      - name: Install Node dependencies
        run: npm ci

      - name: Validate exercise workflow currentness
        run: npm run check:exercise-workflow-currentness

      - name: Validate Book 2+ Part A exercise authoring contract
        run: npm run check:part-a-exercise-authoring-contract

      - name: Validate exercise authority hygiene
        run: npm run check:exercise-authority-hygiene

      - name: Install Python support dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .github/ci-python-requirements.txt

      - name: Install presentation proof tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          function Invoke-WithRetry {
            param(
              [Parameter(Mandatory = $true)][scriptblock]$ScriptBlock,
              [Parameter(Mandatory = $true)][string]$Label,
              [int]$Attempts = 3
            )
            for ($attempt = 1; $attempt -le $Attempts; $attempt += 1) {
              try {
                return & $ScriptBlock
              } catch {
                if ($attempt -eq $Attempts) { throw "$Label failed after $Attempts attempts: $($_.Exception.Message)" }
                Write-Warning "$Label failed on attempt $attempt/${Attempts}: $($_.Exception.Message)"
                Start-Sleep -Seconds (10 * $attempt)
              }
            }
          }
          Invoke-WithRetry -Label "LibreOffice install" -ScriptBlock {
            choco install libreoffice-fresh -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco exited with $LASTEXITCODE" }
          }
          $popplerRoot = Join-Path $env:RUNNER_TEMP "poppler"
          New-Item -ItemType Directory -Force -Path $popplerRoot | Out-Null
          $headers = @{
            "User-Agent" = "4veco-platform-ci"
            "Accept" = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          if ($env:GITHUB_TOKEN) {
            $headers["Authorization"] = "Bearer $env:GITHUB_TOKEN"
          }
          $release = Invoke-WithRetry -Label "Poppler release lookup" -ScriptBlock {
            Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/oschwartz10612/poppler-windows/releases/latest"
          }
          $asset = $release.assets | Where-Object { $_.name -match "^Release-.*\.zip$" } | Select-Object -First 1
          if (-not $asset) { throw "No Poppler Windows release zip found" }
          $popplerZip = Join-Path $env:RUNNER_TEMP $asset.name
          Invoke-WithRetry -Label "Poppler download" -ScriptBlock {
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $popplerZip
          }
          Expand-Archive -LiteralPath $popplerZip -DestinationPath $popplerRoot -Force
          $soffice = "C:\Program Files\LibreOffice\program\soffice.exe"
          if (-not (Test-Path -LiteralPath $soffice)) {
            $soffice = (Get-ChildItem -Path "C:\Program Files" -Filter soffice.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }
          $pdftoppm = (Get-ChildItem -Path $popplerRoot -Filter pdftoppm.exe -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $pdftoppm) {
            $pdftoppm = (Get-Command pdftoppm -ErrorAction SilentlyContinue).Source
          }
          if (-not $soffice) { throw "soffice.exe not found after LibreOffice install" }
          if (-not $pdftoppm) { throw "pdftoppm.exe not found after Poppler install" }
          "SOFFICE_PATH=$soffice" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PDFTOPPM_PATH=$pdftoppm" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          (Split-Path -Parent $soffice) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          (Split-Path -Parent $pdftoppm) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Validate platform Jest suite
        run: npm run check:platform

      - name: Build presentation-v2 registered decks
        run: npm run build:presentation-v2

      - name: Validate presentation-v2 HTML QA
        run: npm run check:presentation-v2-html-qa -- --output-dir ..\ci-artifacts\presentation-v2-html-qa

      - name: Validate presentation-v2 legacy guard
        run: npm run check:presentation-v2-legacy-guard -- --output ..\ci-artifacts\presentation-v2-legacy-guard.json

      - name: Validate presentation-v2 PPTX proof
        run: npm run check:presentation-v2-pptx-proof -- --output-dir ..\ci-artifacts\presentation-v2-pptx-proof

      - name: Validate reasoning golden family guardrails
        run: npm run check:reasoning-golden

      - name: Validate paragraph landing V2 guardrails
        run: npm run check:landing-v2

      - name: Validate News Detective V2 guardrails
        run: npm run check:news-detective-v2

      - name: Validate active scope language
        run: npm run check:scope-language

      - name: Validate active governance wording
        run: npm run check:active-governance-wording

      - name: Validate Golden Graph Advisory 113 proof
        run: npm run check:golden-graph-advisory-113

      - name: Validate Scale Proof 3P product path proof
        run: npm run check:scale-proof-3p-product-path

      - name: Validate Y1 Golden rollout wave
        env:
          Y1_GOLDEN_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          Y1_GOLDEN_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          Y1_GOLDEN_PUSH_BASE_SHA: ${{ github.event.before }}
          Y1_GOLDEN_PUSH_HEAD_SHA: ${{ github.sha }}
          Y1_GOLDEN_MANUAL_BASE_SHA: ${{ inputs.y1_base_sha }}
          Y1_GOLDEN_MANUAL_HEAD_SHA: ${{ inputs.y1_head_sha }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $mode = 'pull_request'
            $base = $env:Y1_GOLDEN_PR_BASE_SHA
            $head = $env:Y1_GOLDEN_PR_HEAD_SHA
            $env:Y1_GOLDEN_SYNTHETIC_MERGE_SHA = $env:GITHUB_SHA
          } elseif ($env:GITHUB_EVENT_NAME -eq 'push') {
            $mode = 'main_push'
            $base = $env:Y1_GOLDEN_PUSH_BASE_SHA
            $head = $env:Y1_GOLDEN_PUSH_HEAD_SHA
          } else {
            $mode = 'manual'
            $base = $env:Y1_GOLDEN_MANUAL_BASE_SHA
            $head = $env:Y1_GOLDEN_MANUAL_HEAD_SHA
          }
          $env:Y1_GOLDEN_EVENT_BASE_SHA = $base
          $env:Y1_GOLDEN_EVENT_HEAD_SHA = $head
          npm run check:y1-golden-rollout-wave-1 -- --event-mode $mode --scope-mode auto --base $base --head $head --lesson-base 071a465a03e287bc5768d88aabbec3e63b15ee09 --lesson-head HEAD

      - name: Validate report JSON
        run: node build-scripts/reports/validate-report-json.js

      - name: Validate MTU evidence layer freshness
        run: node build-scripts/references/check-mtu-evidence-layer.js

      - name: Validate MTU-H7 Bundle 4 protected adjudication packet
        run: npm run check:mtu-h7-bundle4

      - name: Validate roadmap version index
        run: node build-scripts/references/check-roadmap-version-index.js

      - name: Check URL index is current
        run: node build-scripts/sprints/emit-url-index.js --check

      - name: Check GitHub agent indexes against repository heads
        run: npm run check:agent-index-freshness

      - name: Check CI evidence line endings
        run: node build-scripts/ci/check-evidence-line-endings.js

      - name: Check platform diff hygiene
        run: git diff --check

      - name: Check lessen diff hygiene
        run: git -C ../4veco-lessen diff --check

      - name: Upload CI diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-ci-diagnostics
          path: |
            4veco-platform/reports/sprints/*-command-log.jsonl
            4veco-platform/reports/sprints/*-command-log.md
            4veco-platform/reports/json/*.json
            4veco-platform/reports/url-index.md
            ci-artifacts/platform-ci-evidence.json
            ci-artifacts/presentation-v2-html-qa/**
            ci-artifacts/presentation-v2-legacy-guard.json
            ci-artifacts/presentation-v2-pptx-proof/**
          if-no-files-found: ignore
          retention-days: 14
