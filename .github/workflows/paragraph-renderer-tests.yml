name: paragraph-renderer-tests

on:
  pull_request:
    paths:
      - build-scripts/textbook/**
      - build-scripts/templates/template-build-paragraph-pdf.py
      - .github/workflows/paragraph-renderer-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-regression-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: build-scripts/textbook/requirements.txt
      - name: Install paragraph renderer dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pandoc libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
          python -m pip install -r build-scripts/textbook/requirements.txt
      - name: Test actual rendered output
        run: python -m unittest discover -s build-scripts/textbook -p 'test_*.py'
