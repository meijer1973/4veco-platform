name: paired-textbook-maintenance-ci

on:
  pull_request:
    paths:
      - 'build-scripts/books/*textbook_maintenance*'
      - 'build-scripts/books/textbook-maintenance*'
      - 'reports/review-gates/textbook-maintenance-20261004/**'
      - '.github/workflows/paired-textbook-maintenance-ci.yml'
  workflow_dispatch:
    inputs:
      lesson_sha:
        description: Exact paired lessons commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-maintenance-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          path: 4veco-platform
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select exact lesson head
        id: pair
        working-directory: 4veco-platform
        env:
          REQUESTED: ${{ inputs.lesson_sha }}
        run: |
          node - <<'JS'
          const fs=require('fs');
          const sha=process.env.REQUESTED||fs.readFileSync('build-scripts/books/textbook-maintenance-lesson-head.txt','utf8').trim();
          if(!/^[a-f0-9]{40}$/.test(sha))throw Error('Exact lesson SHA required');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'sha='+sha+'\n');
          JS
      - uses: actions/checkout@v6
        with:
          repository: meijer1973/4veco-lessen
          path: 4veco-lessen
          ref: ${{ steps.pair.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        working-directory: 4veco-platform
        run: |
          npm ci
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 libcairo2
          python -m pip install -r build-scripts/books/book1_second_edition/requirements.txt
      - name: Authenticate current pair and independent review
        working-directory: 4veco-platform
        env:
          PLATFORM_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          LESSON_SHA: ${{ steps.pair.outputs.sha }}
        run: |
          mkdir -p ../maintenance-ci-evidence
          node - <<'JS'
          const fs=require('fs'),{execFileSync}=require('child_process');
          const head=cwd=>execFileSync('git',['rev-parse','HEAD'],{cwd,encoding:'utf8'}).trim();
          if(head('.')!==process.env.PLATFORM_SHA||head('../4veco-lessen')!==process.env.LESSON_SHA)throw Error('Unexpected checkout pair');
          const r=require('./build-scripts/books/textbook-maintenance-revision');
          const result=r.verify({requireTracked:true,requireReview:true});
          if(!result.passed||result.lesson_state!==r.REVISION)throw Error(JSON.stringify(result));
          fs.writeFileSync('../maintenance-ci-evidence/pair.json',JSON.stringify({platform:head('.'),lessons:head('../4veco-lessen'),verification:result},null,2)+'\n');
          JS
      - name: Check saved publications, native presentations and regressions
        working-directory: 4veco-platform
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          BOOK1_EDITION_ROOT: ../4veco-lessen/Boek 1 - Grondslagen, vraag en aanbod/edities/tweede-editie-2026
        run: |
          python -m unittest discover -s build-scripts/books -p test_textbook_maintenance.py -v
          python build-scripts/books/verify_textbook_maintenance.py --lessons ../4veco-lessen --report ../maintenance-ci-evidence/books.json
          python build-scripts/books/verify_textbook_maintenance_presentations.py --lessons ../4veco-lessen
          python build-scripts/books/book1_second_edition/targets.py --lessons ../4veco-lessen --check
          python build-scripts/books/book1_second_edition/review_snapshots.py --lessons ../4veco-lessen --check
          python build-scripts/books/book1_second_edition/book/validate_book.py
          cp "$BOOK1_EDITION_ROOT/qa/validation.json" ../maintenance-ci-evidence/book1-assembly.json
          npx jest build-scripts/books/textbook-maintenance-revision.test.js build-scripts/books/book1-classroom-scope.test.js build-scripts/ci/check-y1-product-evidence.test.js --runInBand
          git diff --check
          git -C ../4veco-lessen diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: textbook-maintenance-pair-evidence
          path: maintenance-ci-evidence/
