<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc">
<title id="title">De appelmarkt: evenwicht en surplus</title>
<desc id="desc">Vraag Qv = 120 min 2P en aanbod Qa = 3P min 30. Evenwicht bij 60 kilogram per week en 30 euro per kilogram. Het blauwe gebied CS bedraagt 900 euro per week en het groene gebied PS 600 euro per week. Alleen niet-negatieve prijzen en hoeveelheden worden getoond.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6" fill="#2D3748"/></marker></defs>
<rect width="1000" height="800" fill="#F7FAFC"/>
<g font-family="Arial, sans-serif" font-size="18" fill="#2D3748">
<text x="45" y="43" font-size="29" font-weight="700" fill="#1E2761">De appelmarkt: evenwicht en surplus</text>
<text x="45" y="80" font-size="21">Vraag: Qᵥ = 120 − 2P    |    Aanbod: Qₐ = 3P − 30</text>
<polygon id="cs" points="110.00000000,450.00000000 110.00000000,240.00000000 470.00000000,450.00000000" fill="#85C1E9"/>
<polygon id="ps" points="110.00000000,590.00000000 110.00000000,450.00000000 470.00000000,450.00000000" fill="#82E0AA"/>
<line id="q-guide" x1="470.00000000" y1="660.00000000" x2="470.00000000" y2="450.00000000" stroke="#718096" stroke-width="1.8" stroke-dasharray="6 5"/>
<line id="p-guide" x1="110.00000000" y1="450.00000000" x2="470.00000000" y2="450.00000000" stroke="#718096" stroke-width="1.8" stroke-dasharray="6 5"/>
<line id="demand" x1="110.00000000" y1="240.00000000" x2="830.00000000" y2="660.00000000" stroke="#1A5276" stroke-width="3.5"/>
<line id="supply" x1="110.00000000" y1="590.00000000" x2="890.00000000" y2="286.66666667" stroke="#1E8449" stroke-width="3.5"/>
<path d="M110,140 V660 H928" fill="none" stroke="#2D3748" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M110,660 V140" fill="none" stroke="#2D3748" stroke-width="2" marker-end="url(#arrow)"/>
<text x="110" y="120" font-size="20">P (€ per kilogram)</text>
<text x="930" y="721" font-size="20" text-anchor="end">Q (kilogram per week)</text>
